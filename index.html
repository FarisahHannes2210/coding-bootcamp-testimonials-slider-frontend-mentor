<!DOCTYPE html>
<html lang="en">
  <head>
    <link rel="stylesheet" href="styles.css" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />

    <title>Frontend Mentor | Coding Bootcamp Testimonials Slider</title>
  </head>
  <body>
  
        <div class="contents">

          <div class="imageSlider">
            <img class="image" id="profPic"/>

              <img onclick="main()" id="prev_btn" src="images/icon-prev.svg" alt="previous icon" />
              <img onclick="main()"  id="next_btn" src="images/icon-next.svg" alt="next icon" />
            </div>

          </div>

          <div class="quotes">
            <h1 id="quote">
             
            </h1>
            <div class="nameJob">

            </div>
          </div>

          
        </div>
    <script src="index.js"></script>
  </body>
</html>
